# CONFIGURACIÓN BASE (Común para todos los entornos)
spring:
  application:
    name: ms-lote
  
  profiles:
    active: dev

  datasource:
    url: ${JDBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: none # 🔥 Cambiado a none para evitar bloqueos DDL
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

server:
  port: ${PORT:8085}

# Registro en Eureka
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# Trazabilidad técnica
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: DEBUG
    java.sql: DEBUG

# =========================
# PERFIL DEV (LOCAL)
# =========================
---
spring:
  config:
    activate:
      on-profile: dev
ms:
  producto:
    url: ${MS_PRODUCTO_URL}

# =========================
# PERFIL REMOTE (EUREKA)
# =========================
---
spring:
  config:
    activate:
      on-profile: remote
ms:
  producto:
    url: lb://ms-producto