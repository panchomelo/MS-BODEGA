# CONFIGURACIÓN BASE (Común)
spring:
  application:
    name: ms-categoria
  datasource:
    url: ${JDBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      data-source-properties:
        oracle.net.authentication_services: "()"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

server:
  port: ${PORT:8083} # Requisito IE 3.3.1 [10]

# Registro en Eureka (Requisito IE 3.3.2) [7, 12]
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://ms-eureka-con:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: DEBUG

---
# PERFIL DE DESARROLLO (Local) [9]
spring:
  config:
    activate:
      on-profile: dev
ms:
  producto:
    url: ${MS_PRODUCTO_URL}
  inventario:
    url: ${MS_INVENTARIO_URL}

---
# PERFIL REMOTO (Docker / PaaS) [8, 9]
spring:
  config:
    activate:
      on-profile: remote
ms:
  producto:
    url: lb://ms-producto # Ruta dinámica vía Gateway/Eureka [13]
  inventario:
    url: lb://ms-inventario # Ruta dinámica vía Gateway/Eureka [13]