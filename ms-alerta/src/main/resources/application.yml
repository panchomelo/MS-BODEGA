server:
  port: 8088

spring:
  application:
    name: ms-alerta

  datasource:
    url: ${JDBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        "[format_sql]": true

# Configuración de OpenAPI / Swagger
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

# Niveles de Logs para Debug
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
    com:
      zaxxer:
        hikari: DEBUG
    java:
      sql: DEBUG

# Comunicación con otros Microservicios
ms:
  producto:
    # En Render cambiarás esto por la URL interna o pública del ms-producto
    url: ${MS_PRODUCTO_URL:http://localhost:8080}
