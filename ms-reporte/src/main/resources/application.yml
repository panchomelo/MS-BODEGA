server:
  port: ${PORT:8086}

spring:
  application:
    name: ms-reporte

  datasource:
    url: ${JDBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      data-source-properties:
        oracle.net.authentication_services: "()"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        "[format_sql]": true

# Configuración de OpenAPI / Swagger
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

# Niveles de Logs para Debug
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
    com:
      zaxxer:
        hikari: DEBUG
    java:
      sql: DEBUG

# Comunicación con otros Microservicios
ms:
  usuario:
    # En tu máquina usará localhost:8081 por defecto, en Render inyectarás la URL de producción
    url: ${MS_USUARIO_URL:http://localhost:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://ms-eureka-con:8761/eureka/}
  instance:
    prefer-ip-address: true
