server:
  port: ${PORT:8761}

spring:
  application:
    name: ms-eureka

eureka:
  instance:
    # En la nube usa la IP o el nombre del contenedor en vez de localhost
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/